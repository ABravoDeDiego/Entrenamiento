<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fuerza A · Registro</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f5f5f7}body{margin:0}.wrap{max-width:720px;margin:auto;padding:18px 14px 80px}h1{font-size:24px;margin:4px 0 6px}.sub{color:#666;margin:0 0 20px}.section{font-size:14px;font-weight:800;letter-spacing:.04em;margin:24px 4px 10px}.card{background:#fff;border-radius:18px;padding:16px;margin:10px 0;box-shadow:0 1px 8px #00000010}.card h2{font-size:18px;margin:0 0 6px}.meta{font-size:14px;color:#666;margin-bottom:13px}.goal{font-weight:700;color:#222}.series{display:grid;grid-template-columns:46px 1fr 1fr;gap:8px;align-items:center}.head{font-size:12px;color:#777;text-align:center}.s{font-weight:700}.field{display:flex;align-items:center;border:1px solid #d8d8dc;border-radius:12px;padding:0 10px;background:#fafafa}.field input{width:100%;min-width:0;border:0;background:transparent;font-size:18px;padding:11px 2px;outline:none}.unit{font-size:13px;color:#666}.comments{width:100%;box-sizing:border-box;border:1px solid #d8d8dc;border-radius:12px;padding:11px;margin-top:12px;font-size:16px;resize:vertical;background:#fafafa}.closegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.closegrid label,.full label{font-size:13px;font-weight:700}.closegrid input,.full input,.full textarea{width:100%;box-sizing:border-box;border:1px solid #d8d8dc;border-radius:12px;padding:11px;margin-top:5px;font-size:16px;background:#fafafa}.full{margin-top:10px}.actions{position:sticky;bottom:0;background:#f5f5f7ee;backdrop-filter:blur(10px);padding:12px 0 4px}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:800;background:#111;color:#fff}.secondary{margin-top:8px;background:#e4e4e8;color:#111}.output{white-space:pre-wrap;background:#111;color:#f5f5f5;border-radius:14px;padding:14px;margin-top:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;display:none}.notice{font-size:12px;color:#777;margin-top:8px;text-align:center}@media(max-width:420px){.wrap{padding-left:10px;padding-right:10px}.card{padding:14px}.series{grid-template-columns:38px 1fr 1fr}}
</style>
</head>
<body><main class="wrap">
<h1>FUERZA A · GIMNASIO</h1><p class="sub">Prototipo móvil · los datos permanecen solo en esta página mientras la tengas abierta.</p>
<div id="workout"></div>
<div class="section">CIERRE DE SESIÓN</div>
<div class="card">
 <div class="closegrid">
  <label>Tiempo total<input id="time" inputmode="decimal" placeholder="min"></label>
  <label>Hombro<input id="shoulder" inputmode="decimal" placeholder="0–10"></label>
  <label>Rodilla<input id="knee" inputmode="decimal" placeholder="0–10"></label>
  <label>Zona lumbar<input id="lumbar" inputmode="decimal" placeholder="0–10"></label>
 </div>
 <div class="full"><label>Otras molestias<textarea id="other" rows="2"></textarea></label></div>
 <div class="full"><label>Sensaciones generales<textarea id="feel" rows="3"></textarea></label></div>
</div>
<div class="actions"><button class="btn" onclick="generate()">Generar resumen</button><button class="btn secondary" onclick="copySummary()">Copiar resumen</button><div id="out" class="output"></div><div class="notice">Después pega el resumen directamente en ChatGPT.</div></div>
</main>
<script>
const groups=[
 {name:'SUPER SERIE 1',ex:[
  {n:'Press pecho · Máquina',goal:'3 × 10–12',prev:'20 kg × 10 · 20 kg × 10 · 20 kg × 10',sets:3},
  {n:'Pull-over · Polea/Máquina',goal:'3 × 10–12',prev:'10 kg × 10 · 10 kg × 10 · 10 kg × 10',sets:3}]},
 {name:'SUPER SERIE 2',ex:[
  {n:'Curl bíceps · Máquina/Polea',goal:'3 × 10–12',prev:'Último registro disponible: 6 kg · 10/10/10 (realizado con mancuernas)',sets:3},
  {n:'Tríceps · Polea',goal:'3 × 10–12',prev:'7,5 kg × 10 · 7,5 kg × 10 · 7,5 kg × 10',sets:3}]},
 {name:'SUPER SERIE 3',ex:[
  {n:'Elevaciones laterales · Máquina/Polea',goal:'3 × 8–12',prev:'5 kg × 8 · 5 kg × 10 · 5 kg × 10 (mancuernas)',sets:3},
  {n:'Rotación externa · Polea',goal:'3 × 8–12',prev:'3 kg × 7 · 3 kg × 10 · 3 kg × 10 (mancuernas)',sets:3}]},
 {name:'CORE',ex:[
  {n:'Plancha',goal:'2 series',prev:'45 s · 45 s',sets:2,time:true},
  {n:'Crunch · Peso libre/discos',goal:'2 series',prev:'Sin datos completos en el último registro disponible',sets:2}]}
];
let idx=0;const root=document.getElementById('workout');
groups.forEach(g=>{let t=document.createElement('div');t.className='section';t.textContent=g.name;root.appendChild(t);g.ex.forEach(e=>{e.id='e'+idx++;let c=document.createElement('section');c.className='card';let rows='';for(let i=1;i<=e.sets;i++){rows+=`<div class="s">S${i}</div><div class="field"><input id="${e.id}w${i}" inputmode="decimal" aria-label="${e.n} serie ${i} ${e.time?'segundos':'peso'}"><span class="unit">${e.time?'s':'kg'}</span></div><div class="field"><input id="${e.id}r${i}" inputmode="numeric" aria-label="${e.n} serie ${i} repeticiones" ${e.time?'disabled':''}><span class="unit">${e.time?'—':'reps'}</span></div>`}
c.innerHTML=`<h2>${e.n}</h2><div class="meta"><span class="goal">Objetivo: ${e.goal}</span><br>Anterior: ${e.prev}</div><div class="series"><div></div><div class="head">${e.time?'Tiempo':'Peso'}</div><div class="head">${e.time?'':'Reps'}</div>${rows}</div><textarea id="${e.id}c" class="comments" rows="2" placeholder="Comentarios"></textarea>`;root.appendChild(c)})});
function val(id){return document.getElementById(id).value.trim()}
function generate(){let s='FUERZA A — GIMNASIO\n\n';groups.forEach(g=>{s+=g.name+'\n';g.ex.forEach(e=>{let a=[];for(let i=1;i<=e.sets;i++){let w=val(e.id+'w'+i),r=val(e.id+'r'+i);a.push(e.time?`${w||'—'} s`:`${w||'—'} kg - ${r||'—'}`)}s+=`- ${e.n}: ${a.join(' / ')}\n`;let c=val(e.id+'c');if(c)s+=`  Comentarios: ${c}\n`});s+='\n'});s+=`Tiempo total: ${val('time')||'—'} min\n\nMolestias en alguna zona del cuerpo\nHombro: ${val('shoulder')||'—'}/10\nRodilla: ${val('knee')||'—'}/10\nZona lumbar: ${val('lumbar')||'—'}/10\nOtras molestias: ${val('other')||'—'}\n\nSensaciones generales: ${val('feel')||'—'}`;let o=document.getElementById('out');o.textContent=s;o.style.display='block';return s}
async function copySummary(){let s=generate();try{await navigator.clipboard.writeText(s);alert('Resumen copiado. Ya puedes pegarlo en ChatGPT.')}catch(e){let o=document.getElementById('out');let r=document.createRange();r.selectNodeContents(o);let sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);alert('Selecciona el resumen y pulsa Copiar.')}}
</script></body></html>
